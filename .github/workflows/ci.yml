name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-run:
    name: compile, run and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Compile (byte-compile and syntax check)
        run: python -m compileall -q mastering_pytorch scripts tests

      - name: Run smoke demo
        run: python scripts/demo.py

      - name: Run unit tests
        run: python -m unittest discover -s tests -v
